name: Build BK7231N TuyaMCU

on:
  workflow_dispatch:   # запуск вручну з вкладки Actions

jobs:
  refs:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.refs.outputs.version }}
    steps:
      - name: Source checkout
        uses: actions/checkout@v5
      - name: Set version
        id: refs
        run: |
          BRANCH=${GITHUB_REF#refs/*/}
          BRANCHTRANSLATED=$(echo ${BRANCH} | tr '/' '_')
          echo "version=${BRANCHTRANSLATED}_$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT

  build:
    name: BK7231N tuyaMCU
    needs: refs
    runs-on: ubuntu-22.04
    steps:
      - name: Source checkout
        uses: actions/checkout@v5

      - name: Install arm-none-eabi-gcc
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 10.3-2021.10
          path-env-var: ARM_NONE_EABI_GCC_PATH

      - name: Run make
        run: |
          make APP_VERSION=${{ needs.refs.outputs.version }}_tuyaMCU APP_NAME=OpenBK7231N VARIANT="tuyaMCU" OpenBK7231N

      - name: Save build assets
        uses: actions/upload-artifact@v6
        with:
          name: OpenBK7231N_tuyaMCU_${{ needs.refs.outputs.version }}
          path: output/**
          if-no-files-found: warn
